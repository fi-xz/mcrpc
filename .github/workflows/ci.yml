name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PAPERMC_VERSION: "1.21.11"
  TEST_SERVER_PORT: 12345
  TEST_SERVER_SECRET: "test-secret-for-ci-only"
  TEST_KEYSTORE_PASSWORD: "keystore-password-for-ci-only"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Setup PaperMC Server
        env:
          PAPERMC_VERSION: ${{ env.PAPERMC_VERSION }}
          TEST_SERVER_PORT: ${{ env.TEST_SERVER_PORT }}
          TEST_SERVER_SECRET: ${{ env.TEST_SERVER_SECRET }}
        run: bash .github/scripts/setup-paper.sh

      - name: Test with live server
        env:
          TEST_HOST: "127.0.0.1"
          TEST_PORT: "${{ env.TEST_SERVER_PORT }}"
          TEST_SECRET: "${{ env.TEST_SERVER_SECRET }}"
          USE_TLS: "false"
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
          flags: unittests
          name: codecov-umbrella

      - name: Cleanup PaperMC Server
        if: always()
        run: |
          if [ -f server/server.pid ]; then
            kill $(cat server/server.pid) 2>/dev/null || true
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Setup PaperMC Server
        env:
          PAPERMC_VERSION: ${{ env.PAPERMC_VERSION }}
          TEST_SERVER_PORT: ${{ env.TEST_SERVER_PORT }}
          TEST_SERVER_SECRET: ${{ env.TEST_SERVER_SECRET }}
        run: bash .github/scripts/setup-paper.sh

      - name: Test with race detector
        env:
          TEST_HOST: "127.0.0.1"
          TEST_PORT: "${{ env.TEST_SERVER_PORT }}"
          TEST_SECRET: "${{ env.TEST_SERVER_SECRET }}"
          USE_TLS: "false"
        run: go test -race -count=1 ./...

      - name: Cleanup
        if: always()
        run: |
          if [ -f server/server.pid ]; then
            kill $(cat server/server.pid) 2>/dev/null || true
          fi

  test-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Setup PaperMC Server with TLS
        env:
          PAPERMC_VERSION: ${{ env.PAPERMC_VERSION }}
          TEST_SERVER_PORT: ${{ env.TEST_SERVER_PORT }}
          TEST_SERVER_SECRET: ${{ env.TEST_SERVER_SECRET }}
          TLS: "true"
          KEYSTORE_PASSWORD: ${{ env.TEST_KEYSTORE_PASSWORD }}
        run: bash .github/scripts/setup-paper.sh

      # The certificate names localhost, and the client trusts it through
      # TEST_TLS_CA, so this exercises a real wss handshake with verification
      # on rather than skipped. No client certificate is presented, which is the
      # configuration most servers actually run.
      - name: Test over TLS
        env:
          TEST_HOST: "localhost"
          TEST_PORT: "${{ env.TEST_SERVER_PORT }}"
          TEST_SECRET: "${{ env.TEST_SERVER_SECRET }}"
          USE_TLS: "true"
          TEST_TLS_CA: "server/ca.crt"
        run: go test -race -count=1 ./...

      - name: Cleanup PaperMC Server
        if: always()
        run: |
          if [ -f server/server.pid ]; then
            kill $(cat server/server.pid) 2>/dev/null || true
          fi

  build-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
