name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PAPERMC_VERSION: "1.21.11"
  TEST_SERVER_PORT: 12345
  TEST_SERVER_SECRET: "test-secret-for-ci-only"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Setup PaperMC Server
        run: |
          mkdir -p server
          cd server

          # Verify Java version
          java -version

          # Fetch latest build info and extract download URL using jq
          echo "Fetching latest PaperMC build info..."
          PAPER_URL=$(curl -s -A "mcrpc-github-ci/1.0.0 (https://github.com/fi-xz/mcrpc)" \
            "https://fill.papermc.io/v3/projects/paper/versions/${{ env.PAPERMC_VERSION }}/builds/latest" | \
            jq -r '.downloads."server:default".url')

          if [ -z "$PAPER_URL" ] || [ "$PAPER_URL" = "null" ]; then
            echo "Failed to fetch PaperMC download URL"
            exit 1
          fi

          echo "Downloading PaperMC from: $PAPER_URL"
          curl -o paper.jar "$PAPER_URL"

          echo "eula=true" > eula.txt

          # Create server.properties with WebSocket enabled
          cat > server.properties << 'EOF'
          management-server-allowed-origins=
          management-server-enabled=true
          management-server-host=localhost
          management-server-port=${{ env.TEST_SERVER_PORT }}
          management-server-secret=${{ env.TEST_SERVER_SECRET }}
          management-server-tls-enabled=false
          management-server-tls-keystore=
          management-server-tls-keystore-password=
          EOF

          # Start server in background
          nohup java -Xms512M -Xmx1G -jar paper.jar nogui > server.log 2>&1 &
          echo $! > server.pid

          # Wait for server to start (check log)
          for i in {1..60}; do
            if grep -q "Done" server.log 2>/dev/null; then
              echo "Server started successfully"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Server failed to start within 60 seconds"
              cat server.log
              exit 1
            fi
            sleep 1
          done

          cd ..

      - name: Test with live server
        env:
          TEST_HOST: "127.0.0.1"
          TEST_PORT: "${{ env.TEST_SERVER_PORT }}"
          TEST_SECRET: "${{ env.TEST_SERVER_SECRET }}"
          USE_TLS: "false"
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
          flags: unittests
          name: codecov-umbrella

      - name: Cleanup PaperMC Server
        if: always()
        run: |
          if [ -f server/server.pid ]; then
            kill $(cat server/server.pid) 2>/dev/null || true
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Setup PaperMC Server
        run: |
          mkdir -p server
          cd server

          # Verify Java version
          java -version

          # Fetch latest build info and extract download URL using jq
          echo "Fetching latest PaperMC build info..."
          PAPER_URL=$(curl -s -A "mcrpc-github-ci/1.0.0 (https://github.com/fi-xz/mcrpc)" \
            "https://fill.papermc.io/v3/projects/paper/versions/${{ env.PAPERMC_VERSION }}/builds/latest" | \
            jq -r '.downloads."server:default".url')

          if [ -z "$PAPER_URL" ] || [ "$PAPER_URL" = "null" ]; then
            echo "Failed to fetch PaperMC download URL"
            exit 1
          fi

          echo "Downloading PaperMC from: $PAPER_URL"
          curl -o paper.jar "$PAPER_URL"

          echo "eula=true" > eula.txt

          cat > server.properties << 'EOF'
          management-server-allowed-origins=
          management-server-enabled=true
          management-server-host=localhost
          management-server-port=${{ env.TEST_SERVER_PORT }}
          management-server-secret=${{ env.TEST_SERVER_SECRET }}
          management-server-tls-enabled=false
          management-server-tls-keystore=
          management-server-tls-keystore-password=
          EOF

          nohup java -Xms512M -Xmx1G -jar paper.jar nogui > server.log 2>&1 &
          echo $! > server.pid

          for i in {1..60}; do
            if grep -q "Done" server.log 2>/dev/null; then
              echo "Server started successfully"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Server failed to start"
              cat server.log
              exit 1
            fi
            sleep 1
          done

          cd ..

      - name: Test with race detector
        env:
          TEST_HOST: "127.0.0.1"
          TEST_PORT: "${{ env.TEST_SERVER_PORT }}"
          TEST_SECRET: "${{ env.TEST_SERVER_SECRET }}"
          USE_TLS: "false"
        run: go test -race -count=1 ./...

      - name: Cleanup
        if: always()
        run: |
          if [ -f server/server.pid ]; then
            kill $(cat server/server.pid) 2>/dev/null || true
          fi

  build-cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
